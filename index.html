<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title / description are filled in from content/site.js at runtime. -->
  <title>Personal site</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#12141f">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <!-- Fonts: Space Grotesk (display), DM Sans (body), Space Mono (labels), EB Garamond (blog). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <!-- Optional: LaTeX math in blog posts / descriptions via KaTeX ($...$ and $$...$$).
       Delete these three lines if you never want math. Everything else works without it. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="document.dispatchEvent(new Event('katex-ready'))"></script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/intro.css">
</head>
<body>
  <!-- Ambient background (drawn by js/background.js) -->
  <canvas id="bg" class="bg" aria-hidden="true"></canvas>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Top chrome: brand, tabs (with dropdowns), tools -->
  <header class="chrome" id="chrome">
    <a class="brand" href="#/" id="brand">
      <img id="brand-avatar" class="brand-avatar" alt="" src="assets/images/profile.svg">
      <span id="brand-label" class="brand-label">SITE</span>
    </a>

    <nav class="tabs" id="tabs" aria-label="Primary">
      <ul>
        <li><a href="#/" data-nav="home">Home</a></li>
        <li class="has-menu" data-menu="projects">
          <a href="#/projects" data-nav="projects">Projects</a>
          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-projects" aria-label="Show project list">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu" id="menu-projects" role="menu"></div>
        </li>
        <li class="has-menu" data-menu="blog">
          <a href="#/blog" data-nav="blog">Blog</a>
          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-blog" aria-label="Show blog post list">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu" id="menu-blog" role="menu"></div>
        </li>
        <li><a href="#/about" data-nav="about">About</a></li>
      </ul>
    </nav>

    <div class="tools">
      <div class="music" id="music">
        <button id="music-btn" class="icon-btn music-btn" type="button" aria-expanded="false" aria-controls="music-panel" aria-label="Music">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <div class="music-panel" id="music-panel"></div>
      </div>
      <button id="replay-intro" class="icon-btn" type="button" title="Replay intro" aria-label="Replay intro">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light / dark" aria-label="Toggle light or dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button id="nav-toggle" class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="tabs" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Left pop-up tab (rail): lists projects / posts / sections for the current area -->
  <aside id="rail" class="rail" hidden>
    <button class="rail-tab" id="rail-tab" type="button" aria-expanded="false" aria-controls="rail-panel">
      <span class="rail-tab-dots" aria-hidden="true"></span>
      <span class="rail-tab-label" id="rail-tab-label">MENU</span>
    </button>
    <div class="rail-panel" id="rail-panel">
      <div class="rail-head">
        <span class="eyebrow-mini" id="rail-kicker">JUMP TO</span>
        <span class="rail-title" id="rail-title">Projects</span>
      </div>
      <ol class="rail-list" id="rail-list"></ol>
    </div>
  </aside>

  <main id="main" class="main" tabindex="-1"></main>
  <footer class="footer" id="footer"></footer>

  <!-- Intro overlay (volleyball spike). Built by js/intro.js -->
  <div id="intro" class="intro" hidden></div>

  <!-- Content you edit -->
  <script src="content/site.js"></script>
  <script src="content/projects.js"></script>
  <script src="content/blog.js"></script>
  <script src="content/about.js"></script>
  <!-- Site code -->
  <script src="js/util.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/background.js"></script>
  <script src="js/visitors.js"></script>
  <script src="js/music.js"></script>
  <script src="js/intro.js"></script>
  <!-- 3D intro: Three.js (vendored, MIT) + the scene. Delete these two lines to use the lighter 2D intro only. -->
  <script src="js/vendor/three.min.js"></script>
  <script src="js/intro3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
