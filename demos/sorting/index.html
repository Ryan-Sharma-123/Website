<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorting Visualizer</title>
<style>
  :root { --bg:#0c1122; --line:rgba(255,255,255,.08); --text:#eef2ff; --muted:#98a3bd; --accent:#ff7a1a; --accent2:#6d8bd6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"DM Sans", system-ui, sans-serif; overflow:hidden; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  canvas { flex:1; width:100%; display:block; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; padding:.5rem .6rem; border-top:1px solid var(--line); background:#0a0e1c; font-family:"Space Mono", ui-monospace, monospace; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; }
  button, select { font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--text); background:none; border:1px solid rgba(255,255,255,.2); border-radius:2rem; padding:.42rem .7rem; cursor:pointer; }
  select { background:#0a0e1c; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#180b00; }
  label { display:inline-flex; align-items:center; gap:.4rem; color:var(--muted); }
  input[type=range] { width:80px; accent-color:var(--accent); }
  .stat { margin-left:auto; color:var(--muted); }
  .stat b { color:var(--accent); font-weight:400; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="bar">
    <select id="algo">
      <option value="bubble">Bubble</option>
      <option value="insertion">Insertion</option>
      <option value="selection">Selection</option>
      <option value="merge">Merge</option>
      <option value="quick" selected>Quick</option>
    </select>
    <button id="sort" class="primary">Sort</button>
    <button id="shuffle">Shuffle</button>
    <button id="nearly">Nearly sorted</button>
    <label>Size <input id="size" type="range" min="10" max="200" value="60"></label>
    <label>Speed <input id="speed" type="range" min="1" max="60" value="20"></label>
    <span class="stat">Compares <b id="cmp">0</b> · Writes <b id="wr">0</b></span>
  </div>
</div>
<script>
(function () {
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var a = [], hi = {}, it = null, cmp = 0, wr = 0, dpr = 1;
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }
  function reset(n) { a = []; for (var i = 0; i < n; i++) a.push(i + 1); shuffle(); }
  function shuffle() { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } stop(); draw(); }
  function nearly() { a.sort(function (x, y) { return x - y; }); for (var k = 0; k < Math.max(1, a.length / 12); k++) { var i = Math.floor(Math.random() * a.length), j = Math.min(a.length - 1, i + Math.floor(Math.random() * 4)); var t = a[i]; a[i] = a[j]; a[j] = t; } stop(); draw(); }
  function stop() { it = null; hi = {}; cmp = 0; wr = 0; stats(); document.getElementById('sort').textContent = 'Sort'; }
  function stats() { document.getElementById('cmp').textContent = cmp; document.getElementById('wr').textContent = wr; }
  function less(i, j) { cmp++; hi = { c1: i, c2: j }; return a[i] < a[j]; }
  function swap(i, j) { wr += 2; hi = { w1: i, w2: j }; var t = a[i]; a[i] = a[j]; a[j] = t; }
  function write(i, v) { wr++; hi = { w1: i }; a[i] = v; }

  function* bubble() { for (var n = a.length; n > 1; n--) for (var i = 0; i < n - 1; i++) { if (less(i + 1, i)) { yield; swap(i, i + 1); } yield; } }
  function* insertion() { for (var i = 1; i < a.length; i++) { var v = a[i], j = i - 1; while (j >= 0 && (cmp++, hi = { c1: j, c2: i }, a[j] > v)) { yield; write(j + 1, a[j]); yield; j--; } write(j + 1, v); yield; } }
  function* selection() { for (var i = 0; i < a.length - 1; i++) { var m = i; for (var j = i + 1; j < a.length; j++) { if (less(j, m)) m = j; yield; } if (m !== i) { swap(i, m); yield; } } }
  function* merge(lo, hi_) { if (lo === undefined) { lo = 0; hi_ = a.length; } if (hi_ - lo < 2) return; var mid = (lo + hi_) >> 1; yield* merge(lo, mid); yield* merge(mid, hi_); var tmp = [], i = lo, j = mid; while (i < mid && j < hi_) { if (less(j, i)) tmp.push(a[j++]); else tmp.push(a[i++]); yield; } while (i < mid) tmp.push(a[i++]); while (j < hi_) tmp.push(a[j++]); for (var k = 0; k < tmp.length; k++) { write(lo + k, tmp[k]); yield; } }
  function* quick(lo, hi_) { if (lo === undefined) { lo = 0; hi_ = a.length - 1; } if (lo >= hi_) return; var p = a[hi_], i = lo; for (var j = lo; j < hi_; j++) { cmp++; hi = { c1: j, c2: hi_ }; if (a[j] < p) { swap(i, j); i++; } yield; } swap(i, hi_); yield; yield* quick(lo, i - 1); yield* quick(i + 1, hi_); }
  var ALGOS = { bubble: bubble, insertion: insertion, selection: selection, merge: merge, quick: quick };

  function draw() {
    var w = canvas.clientWidth, h = canvas.clientHeight, n = a.length, bw = w / n;
    ctx.fillStyle = '#0c1122'; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < n; i++) {
      var bh = (a[i] / n) * (h - 24);
      ctx.fillStyle = (i === hi.w1 || i === hi.w2) ? '#6d8bd6' : (i === hi.c1 || i === hi.c2) ? '#ff7a1a' : 'rgba(238,242,255,.55)';
      ctx.fillRect(i * bw + Math.min(1, bw * 0.15), h - bh, Math.max(1, bw - Math.min(2, bw * 0.3)), bh);
    }
  }
  function loop() {
    if (it) {
      var steps = +document.getElementById('speed').value;
      for (var s = 0; s < steps; s++) { var r = it.next(); if (r.done) { it = null; hi = {}; document.getElementById('sort').textContent = 'Sort'; break; } }
      stats(); draw();
    }
    requestAnimationFrame(loop);
  }
  document.getElementById('sort').addEventListener('click', function () {
    if (it) { stop(); draw(); return; }
    cmp = 0; wr = 0; it = ALGOS[document.getElementById('algo').value](); this.textContent = 'Stop';
  });
  document.getElementById('shuffle').addEventListener('click', shuffle);
  document.getElementById('nearly').addEventListener('click', nearly);
  document.getElementById('size').addEventListener('input', function () { reset(+this.value); });
  window.addEventListener('resize', resize);
  reset(60); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
